name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend/go.mod
      - run: docker pull postgres:18.4-bookworm
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - run: go vet ./...
        working-directory: backend
      - run: staticcheck ./...
        working-directory: backend
      - run: govulncheck ./...
        working-directory: backend
      - run: make test-race

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run check:size
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: docker compose -f docker-compose.yaml -p engmark-prod --profile host config
        env:
          POSTGRES_USER: engmark
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: engmark
          ENGMARK_SITE: ":80"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          load: true
          tags: engmark:ci
          build-args: |
            VERSION=${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose -f docker-compose.yaml -p engmark-prod --profile host up -d --build --wait
        env:
          POSTGRES_USER: engmark
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: engmark
          ENGMARK_SITE: ":80"
      - run: npx playwright test
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1
      - if: always()
        run: docker compose -f docker-compose.yaml -p engmark-prod --profile host down --remove-orphans
        env:
          POSTGRES_USER: engmark
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: engmark
          ENGMARK_SITE: ":80"
