name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: docker pull postgres:18.4-bookworm
      - run: make test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_API_BASE_URL: http://localhost:5050
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p engmark-prod --profile host config
        env:
          POSTGRES_USER: engmark
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: engmark
          ADMIN_TOKEN: ci
          HTTP_ALLOWED_ORIGINS: http://127.0.0.1
          ENGMARK_SITE: ":80"
      - run: docker build -t engmark:ci .
