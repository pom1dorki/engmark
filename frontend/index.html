<!DOCTYPE html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="fonts-default" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" />
    <link id="fonts-alt" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" media="not all" />
    <title>Engmark</title>
    <script>
      (function () {
        var themes = ["dark", "light", "sepia", "alt-dark"];
        var colors = {
          dark: "#07070a",
          light: "#f4f3ef",
          sepia: "#f0dfbd",
          "alt-dark": "#050507"
        };
        var theme = "dark";
        try {
          theme = localStorage.getItem("ew-theme") || "dark";
        } catch (err) {}
        if (themes.indexOf(theme) === -1) theme = "dark";

        var isAlt = theme.indexOf("alt-") === 0;
        var isLight = theme === "light" || theme === "sepia";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-theme-family", isAlt ? "alt" : "default");
        root.style.colorScheme = isLight ? "light" : "dark";

        var altFonts = document.getElementById("fonts-alt");
        if (altFonts) altFonts.media = isAlt ? "all" : "not all";

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", colors[theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
