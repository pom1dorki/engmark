<!DOCTYPE html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070a" />
    <meta name="description" content="Тренажёр английских слов: перевод, транскрипция, пример и озвучка." />
    <meta property="og:title" content="Engmark — английские слова" />
    <meta property="og:description" content="Тренажёр английских слов: перевод, транскрипция, пример и озвучка." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/fonts/default.css" />
    <link id="fonts-alt" rel="stylesheet" href="/src/fonts/alt.css" media="not all" />
    <link rel="stylesheet" href="/src/App.css" />
    <link rel="preload" href="/api/v1/cards?limit=1000&offset=0" as="fetch" crossorigin="anonymous" />
    <title>Engmark — английские слова</title>
    <script>
      (function () {
        var themes = ["dark", "light", "sepia", "alt-dark"];
        var colors = {
          dark: "#07070a",
          light: "#f4f3ef",
          sepia: "#f0dfbd",
          "alt-dark": "#050507"
        };
        var theme = "dark";
        try {
          theme = localStorage.getItem("ew-theme") || "dark";
        } catch (err) {}
        if (themes.indexOf(theme) === -1) theme = "dark";

        var isAlt = theme.indexOf("alt-") === 0;
        var isLight = theme === "light" || theme === "sepia";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-theme-family", isAlt ? "alt" : "default");
        root.style.colorScheme = isLight ? "light" : "dark";

        var altFonts = document.getElementById("fonts-alt");
        if (altFonts) altFonts.media = isAlt ? "all" : "not all";

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", colors[theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="page">
        <main class="page__main">
          <header class="page__header">
            <h1 class="page__title">Английские слова</h1>
          </header>
          <article class="card is-empty">
            <p class="card__empty">Загрузка…</p>
          </article>
        </main>
      </div>
    </div>
    <noscript>Для тренажёра английских слов нужен JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
