services:
  engmark-postgres:
    image: postgres:18.4-bookworm
    container_name: engmark-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  engmark-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/backend/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: engmark-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:engmark-postgres:5432
    ports:
      - "127.0.0.1:5433:5432"
    depends_on:
      engmark-postgres:
        condition: service_healthy