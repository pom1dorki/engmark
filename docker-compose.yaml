x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.4-bookworm
    logging: *logging
    mem_limit: 512m
    shm_size: 128mb
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    profiles: [host]
    logging: *logging
    mem_limit: 256m
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      HTTP_STATIC_DIR: /srv/engmark
      DATABASE_URL: ${ENGMARK_DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
      LOGGER_FORMAT: json
      GOMEMLIMIT: 200MiB
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/engmark", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 35s
    restart: unless-stopped

  caddy:
    profiles: [host]
    logging: *logging
    image: caddy:2-alpine
    environment:
      ENGMARK_SITE: ${ENGMARK_SITE:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  caddy-config:
