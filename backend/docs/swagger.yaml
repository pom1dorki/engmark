basePath: /
definitions:
  catalog_transport_http.CardDTO:
    properties:
      createdAt:
        type: string
      deckId:
        type: integer
      example:
        type: string
      exampleHighlight:
        type: string
      exampleRu:
        type: string
      extra:
        type: string
      extraLabel:
        type: string
      id:
        type: integer
      ipa:
        type: string
      pos:
        type: string
      posRu:
        type: string
      rusTrans:
        type: string
      stress:
        type: string
      style:
        type: string
      translation:
        type: string
      updatedAt:
        type: string
      version:
        type: integer
      word:
        type: string
    type: object
  catalog_transport_http.CardListDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/catalog_transport_http.CardDTO'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  catalog_transport_http.CreateCardRequest:
    properties:
      deckId:
        type: integer
      example:
        type: string
      exampleHighlight:
        type: string
      exampleRu:
        type: string
      extra:
        type: string
      extraLabel:
        type: string
      ipa:
        type: string
      pos:
        type: string
      posRu:
        type: string
      rusTrans:
        type: string
      stress:
        type: string
      style:
        type: string
      translation:
        type: string
      word:
        type: string
    type: object
  catalog_transport_http.DeckDTO:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      slug:
        type: string
      title:
        type: string
    type: object
  catalog_transport_http.PatchCardRequest:
    properties:
      example:
        type: string
      exampleHighlight:
        type: string
      exampleRu:
        type: string
      extra:
        type: string
      extraLabel:
        type: string
      ipa:
        type: string
      pos:
        type: string
      posRu:
        type: string
      rusTrans:
        type: string
      stress:
