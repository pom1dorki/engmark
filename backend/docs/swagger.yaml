host: localhost:5050
info:
  contact: {}
  description: 'Card catalog. Admin writes require Authorization: Bearer <ADMIN_TOKEN>.'
  title: Engmark API
  version: "0.1"
paths:
  /api/v1/admin/cards:
    post:
      consumes:
      - application/json
      parameters:
      - description: card without id and version
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/catalog_transport_http.CreateCardRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/catalog_transport_http.CardDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create card
      tags:
      - admin
  /api/v1/admin/cards/{id}:
    delete:
      parameters:
      - description: card id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete card
      tags:
      - admin
    patch:
      consumes:
      - application/json
      parameters:
      - description: card id
        in: path
        name: id
        required: true
        type: integer
      - description: version is required
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/catalog_transport_http.PatchCardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog_transport_http.CardDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Patch card
      tags:
      - admin
  /api/v1/cards:
    get:
      parameters:
      - description: max 100
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      - description: deck id
        in: query
        name: deck_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog_transport_http.CardListDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
      summary: List cards
      tags:
      - catalog
  /api/v1/cards/{id}:
    get:
      parameters:
      - description: card id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog_transport_http.CardDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
      summary: Get card
      tags:
      - catalog
  /api/v1/decks:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/catalog_transport_http.DeckDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
      summary: List decks
      tags:
      - catalog
  /api/v1/decks/{id}/cards:
    get:
      parameters:
      - description: deck id
        in: path
        name: id
        required: true
        type: integer
      - description: max 100
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog_transport_http.CardListDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
      summary: List cards in a deck
      tags:
      - catalog
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health_transport_http.StatusBody'
      summary: Liveness
      tags:
      - health
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health_transport_http.StatusBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/core_http_response.ErrorEnvelope'
      summary: Readiness
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Value is "Bearer <ADMIN_TOKEN>". Do not put a real token here.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
